<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מכין ניתוח | Interview Orbit</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f0e8; color: #101719; font-family: "Times New Roman", Times, serif; }
    body { min-height: 100vh; display: grid; place-items: center; }
    .loading-screen { text-align: center; padding: 30px; }
    .loading-screen h1 { font-size: 34px; margin: 0 0 28px; font-weight: 800; }
    .loading-circle { width: 180px; height: 180px; margin: auto; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#4c9490 0deg, #d8d5cd 0deg); position: relative; transition: background .12s linear; }
    .loading-circle::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #f4f0e8; }
    .loading-percent { position: relative; z-index: 1; font-size: 42px; font-weight: 800; }
    .loading-note { margin-top: 24px; color: #3f4a4d; font-size: 22px; font-weight: 800; }
    .loading-circle.blink { animation: loading-blink .18s ease-in-out alternate 6; }
    @keyframes loading-blink { from { filter: brightness(1); } to { filter: brightness(1.8); transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .loading-circle { transition: none; } .loading-circle.blink { animation: none; } }
  </style>
</head>
<body>
  <main class="loading-screen">
    <h1>מיד הניתוח יעלה</h1>
    <div class="loading-circle"><span class="loading-percent">0%</span></div>
    <p class="loading-note">מנתח את ההתאמה למשרה...</p>
  </main>
  <script>
    let progress = 0;
    let target = null;
    let finished = false;
    const circle = document.querySelector('.loading-circle');
    const percent = document.querySelector('.loading-percent');

    function paint() {
      percent.textContent = `${Math.round(progress)}%`;
      circle.style.background = `conic-gradient(#4c9490 ${progress * 3.6}deg, #d8d5cd 0deg)`;
    }

    function finish() {
      if (finished) return;
      finished = true;
      let flashes = 0;
      const blink = () => {
        circle.classList.add('blink');
        setTimeout(() => {
          circle.classList.remove('blink');
          flashes += 1;
          if (flashes < 3) setTimeout(blink, 80);
          else setTimeout(() => window.opener && window.opener.postMessage({ type: 'analysis-loading-complete' }, location.origin), 180);
        }, 180);
      };
      blink();
    }

    function tick() {
      if (target === null) progress = Math.min(86, progress + 0.34);
      else {
        const distance = target - progress;
        if (Math.abs(distance) < 0.5) { progress = target; paint(); finish(); return; }
        progress += Math.sign(distance) * Math.max(0.18, Math.abs(distance) * 0.055);
      }
      paint();
      requestAnimationFrame(tick);
    }

    window.addEventListener('message', event => {
      if (event.origin !== location.origin || !event.data) return;
      if (event.data.type === 'analysis-ready') target = Math.max(0, Math.min(100, Number(event.data.score) || 0));
    });

    if (window.opener) window.opener.postMessage({ type: 'analysis-loading-ready' }, location.origin);
    paint();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
