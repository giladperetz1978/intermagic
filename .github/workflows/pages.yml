name: Deploy Interview Orbit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure frontend API URL
        env:
          API_URL: ${{ secrets.INTERVIEW_API_URL }}
        run: |
          test -n "$API_URL"
          printf 'window.INTERVIEW_API_URL = %s;\n' "$(node -p 'JSON.stringify(process.env.API_URL)')" > public/config.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
